name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run test:types --if-present
      - run: npx tsc --noEmit -p mobile

  rules-tests:
    runs-on: ubuntu-latest
    services:
      firebase-emulator:
        image: node:22
        ports: ['4433:4433', '5002:5002']
        options: >-
          --health-cmd 'curl -f http://localhost:4433 || exit 1'
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - run: npm ci
      - run: npx firebase-tools@15.0.0 emulators:exec 'firebase/test/firestore.rules.test.js' --project demo-bharat-darshan

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - working-directory: mobile
        run: npm install
      - working-directory: mobile
        run: npx expo-doctor --check
      - name: Lint
        run: npx eslint . --ext .js,.jsx,.ts,.tsx
        working-directory: mobile
        continue-on-error: true

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - working-directory: admin
        run: npm install
      - working-directory: admin
        run: npx next lint
      - working-directory: admin
        run: npm run build
